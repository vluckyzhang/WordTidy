name: 发布程序包

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要上传程序包的 Release 标签"
        required: true
        default: "v0.17"
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.package_os }} 程序包
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message || '', '[发布资源包]') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            package_os: windows
          - runner: macos-latest
            package_os: macos
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.17' }}
      PYTHONUTF8: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装后端与打包依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller==6.19.0

      - name: 构建程序包
        run: python 启动器/构建_程序包.py --平台 "${{ matrix.package_os }}" --版本 "${{ env.RELEASE_TAG }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WordTidy-${{ matrix.package_os }}
          path: output/release/*.zip
          if-no-files-found: error

  release:
    name: 上传 Release 资产
    runs-on: ubuntu-latest
    needs: build
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.17' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: WordTidy ${{ env.RELEASE_TAG }}
          body_path: 发布/WordTidy_v0.17_发行说明.md
          files: release-assets/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
