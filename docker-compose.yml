services:
  api:
    build:
      context: ./backend
    container_name: wordtidy-api
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
    container_name: wordtidy-web
    depends_on:
      - api
    ports:
      - "5173:80"
